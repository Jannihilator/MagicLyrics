name: Build

on:
  push:
    tags: ["v*"]            # pushing a tag like v0.1.2 builds both platforms and publishes a GitHub Release
  workflow_dispatch:        # "Run workflow" button on the Actions tab (test build, no Release)

permissions:
  contents: write           # needed to create the Release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLyrics-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build mediaremote-adapter
        run: bash scripts/fetch-mediaremote-adapter.sh

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal app (Apple Silicon + Intel)
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLyrics-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # One job publishes both files, so the two builds never race to create the Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release
      id-token: write       # sign the build attestations
      attestations: write   # store them on GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed proof that each file was built by this workflow from this commit.
      # Anyone can check with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Built by GitHub Actions from the tagged source code ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Not code-signed, so Windows and macOS will warn on first launch; see [Is this safe?](${{ github.server_url }}/${{ github.repository }}#is-this-safe).

            **Verify your download**
            - Checksum: compare against `SHA256SUMS.txt` (Windows: `certutil -hashfile <file> SHA256`, macOS: `shasum -a 256 <file>`)
            - Provenance: `gh attestation verify <file> --repo ${{ github.repository }}`
