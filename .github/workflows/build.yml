name: Build

on:
  push:
    tags: ["v*"]            # pushing a tag like v0.1.2 builds both platforms and publishes a GitHub Release
  workflow_dispatch:        # "Run workflow" button on the Actions tab (test build, no Release)

permissions:
  contents: write           # needed to create the Release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # tauri.updater.conf.json adds a signed update file next to each installer.
      # Without the signing secret (forks, manual test runs) build without it.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          else
            npm run tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLyrics-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build mediaremote-adapter
        run: bash scripts/fetch-mediaremote-adapter.sh

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal app (Apple Silicon + Intel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json
          else
            npm run tauri build -- --target universal-apple-darwin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLyrics-macOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # One job publishes both files, so the two builds never race to create the Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release
      id-token: write       # sign the build attestations
      attestations: write   # store them on GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # An artifact uploaded from two folders (macOS: bundle/dmg + bundle/macos) keeps
      # those subfolders; move everything to dist/ itself.
      - name: Flatten downloaded files
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist

      # Universal macOS bundles have no version in the name; add it so each release's files are distinct.
      - name: Name the macOS update file
        working-directory: dist
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in *.exe.sig MagicLyrics.app.tar.gz MagicLyrics.app.tar.gz.sig; do
            [ -e "$f" ] || { echo "::error::Missing $f. Are the TAURI_SIGNING_PRIVATE_KEY secrets set as repository secrets?"; exit 1; }
          done
          mv MagicLyrics.app.tar.gz "MagicLyrics_${v}_universal.app.tar.gz"
          mv MagicLyrics.app.tar.gz.sig "MagicLyrics_${v}_universal.app.tar.gz.sig"

      # The app reads this from releases/latest to find, download and verify updates.
      - name: Updater manifest (latest.json)
        working-directory: dist
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          exe=$(ls *.exe)
          mac="MagicLyrics_${v}_universal.app.tar.gz"
          jq -n             --arg v "$v"             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg notes "See ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"             --arg win_url "$BASE/$exe" --rawfile win_sig "$exe.sig"             --arg mac_url "$BASE/$mac" --rawfile mac_sig "$mac.sig"             '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {url: $win_url, signature: $win_sig},
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64":  {url: $mac_url, signature: $mac_sig}
            }}' > latest.json
          cat latest.json

      - name: SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.exe *.dmg *.app.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed proof that each file was built by this workflow from this commit.
      # Anyone can check with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.app.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.sig
            dist/latest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Built by GitHub Actions from the tagged source code ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Not code-signed, so Windows and macOS will warn on first launch; see [Is this safe?](${{ github.server_url }}/${{ github.repository }}#is-this-safe).

            **Verify your download**
            - Checksum: compare against `SHA256SUMS.txt` (Windows: `certutil -hashfile <file> SHA256`, macOS: `shasum -a 256 <file>`)
            - Provenance: `gh attestation verify <file> --repo ${{ github.repository }}`
