name: Build macOS

on:
  push:
    tags: ["v*"]            # pushing a tag like v0.1.2 builds and publishes a GitHub Release
  workflow_dispatch:        # "Run workflow" button on the Actions tab (test build, no Release)

permissions:
  contents: write           # needed to create the Release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build mediaremote-adapter
        run: bash scripts/fetch-mediaremote-adapter.sh

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal app (Apple Silicon + Intel)
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: MagicLyrics-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
