<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MagicLyrics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="idle">
    <div id="panel">
      <div id="side">
        <img id="art" alt="" />
        <div id="song"><div id="songTitle"></div><div id="songArtist"></div></div>
        <button id="pp" class="round" title="Play / Pause" aria-label="Play / Pause"></button>
      </div>
      <div id="viewport">
        <div id="lines"></div>
        <div id="status"></div>
      </div>
    </div>

    <!-- The only part of the window that accepts clicks while controls are hidden. -->
    <button id="handle" title="Click: controls · Drag: move" aria-label="Show controls">
      <svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>
    </button>

    <div id="controls">
      <div id="drag" title="Drag to move">⠿ Move <span id="meta"></span></div>
      <section class="group">
        <h3>Elements</h3>
        <div class="items">
          <label class="check" title="Show album art"><input type="checkbox" id="optArt" />Art</label>
          <label class="check" title="Show song title and artist"><input type="checkbox" id="optTitle" />Title</label>
          <label class="check" title="Show play/pause button"><input type="checkbox" id="optPP" />Play</label>
        </div>
      </section>
      <section class="group">
        <h3>Display</h3>
        <div class="items">
          <label class="slider" title="Text size">
            <span class="name">Size</span>
            <span class="track"><input type="range" id="fontSize" min="12" max="36" step="2" /><span class="ticks"></span></span>
            <output id="fontSizeVal"></output>
          </label>
          <div class="field" title="Background opacity">
            <span class="name">Opacity</span>
            <div class="seg" id="opacity">
              <button data-v="low" title="20%">Low</button>
              <button data-v="medium" title="80%">Medium</button>
              <button data-v="high" title="100%">High</button>
            </div>
          </div>
          <div class="dropdown" title="Light or dark panel">
            <span class="name">Theme</span>
            <button id="themeBtn" class="dd-btn"><span id="themeLabel"></span><svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></button>
            <div id="themeMenu" class="dd-menu" hidden>
              <button data-v="auto">Auto<small>match background</small></button>
              <button data-v="light">Light</button>
              <button data-v="dark">Dark</button>
            </div>
          </div>
          <div class="field" title="Highlight color">
            <span class="name">Color</span>
            <div class="swatches" id="accent"></div>
          </div>
        </div>
      </section>
      <section class="group">
        <h3>App</h3>
        <div class="items">
          <button id="sync" title="Fix lyrics timing: click the line you hear">⇅ Sync lyrics</button>
          <button id="refetch" title="Search lyrics for this song again">↻ Re-search</button>
          <button id="quit" title="Quit MagicLyrics">✕ Quit</button>
        </div>
      </section>
    </div>
    <!-- Shown while syncing: lyrics are frozen and scrollable; click the line you hear. -->
    <div id="syncbar">
      <span id="syncHint">Click the line you hear</span>
      <span id="syncOffset"></span>
      <button id="syncReset" title="Remove the timing correction">Reset</button>
      <button id="syncDone" class="primary">Done</button>
    </div>
    <div id="grip" title="Drag to resize"></div>
    <!-- Edge zones (controls open only): every edge resizes width and height together. -->
    <div class="edge" data-dir="SouthWest" style="left:0;top:0;bottom:22px;width:12px"></div>
    <div class="edge" data-dir="SouthEast" style="right:0;top:30px;bottom:22px;width:12px"></div>
    <div class="edge" data-dir="NorthEast" style="left:12px;right:34px;top:0;height:6px"></div>
    <div class="edge" data-dir="SouthEast" style="left:0;right:22px;bottom:0;height:12px"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
